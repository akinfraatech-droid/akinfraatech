<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Details</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>

/* ROOT COLORS (Luxury Theme) */
:root {
  --primary: #D4AF37;
  --secondary: #C5A46D;
  --accent: #8C7853;

  --dark: #0A0A0A;
  --dark-soft: #121212;
  --dark-elevated: #1E1E1E;

  --text: #EDEDED;
  --text-soft: #AFAFAF;
}

/* BODY */
body {
  margin: 0;
  font-family: 'Poppins', Arial, sans-serif;
  background: var(--dark);
  color: var(--text);
}

/* HERO */
.hero {
  
  color: white;
  text-align: center;
  padding: 100px 20px;
  position: relative;
  overflow: hidden;
}

/* subtle glow */
.hero::after {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  
  top: -100px;
  right: -100px;
  filter: blur(60px);
}

.hero h1 {
  color: var(--primary);
  font-size: 48px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.hero p {
  color: var(--text-soft);
  font-size: 16px;
}

/* 🔥 SERVICE TABS */
.service-tabs {
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 25px 20px;
  background: var(--dark-soft);
  flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.service-tabs button {
  padding: 10px 22px;
  border: 1px solid var(--primary);
  background: transparent;
  color: var(--primary);
  cursor: pointer;
  border-radius: 30px;
  transition: all 0.3s ease;
  font-weight: 600;
}

.service-tabs button:hover {
  background: var(--primary);
  color: black;
  box-shadow: 0 0 12px rgba(212,175,55,0.4);
}

.service-tabs button.active {
  background: var(--primary);
  color: black;
  box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

/* SECTION */
.section {
  display: flex;
  align-items: center;
  gap: 60px;
  max-width: 1200px;
  margin: auto;
  padding: 80px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.section:nth-child(even) {
  flex-direction: row-reverse;
}

/* IMAGE STYLE */
.section img {
  width: 50%;
  border-radius: 14px;
  transition: 0.4s ease;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.section img:hover {
  transform: scale(1.03);
}

/* TEXT */
.text {
  width: 50%;
}

.text h2 {
  color: var(--primary);
  margin-bottom: 15px;
  font-size: 28px;
}

.text p {
  color: var(--text-soft);
  line-height: 1.8;
  font-size: 15px;
}

/* CTA */
.cta {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(135deg, #111, #1a1a1a);
}

.cta a {
  background: var(--primary);
  color: black;
  padding: 14px 34px;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta a:hover {
  box-shadow: 0 0 20px rgba(212,175,55,0.6);
  transform: translateY(-2px);
}

/* MOBILE */
@media (max-width: 768px) {
  .section {
    flex-direction: column !important;
    text-align: center;
  }

  .section img,
  .text {
    width: 100%;
  }

  .hero h1 {
    font-size: 30px;
  }
}

</style>
</head>

<body>

<div id="header"></div>

<!-- SERVICE BUTTONS -->
<div class="service-tabs">
  <button onclick="loadService('civil')" id="btn-civil">Electrician</button>
  <button onclick="loadService('interior')" id="btn-interior">Plumbing</button>
  <button onclick="loadService('renovation')" id="btn-renovation">AC Technician</button>
  <button onclick="loadService('wheeler')" id="btn-wheeler">Four Wheeler PDI</button>
</div>
<!-- HERO -->
<div class="hero">
  <h1 id="title"></h1>
  <p id="description"></p>
</div>



<!-- CONTENT -->
<div id="content"></div>

<div id="contact-container"></div>

<div id="footer"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

const data = {

  /* ⚡ ELECTRICIAN */
  civil: {
    title: "Electrician Services",
    description: "Professional electrical services for homes and businesses with safety and reliability.",

    sections: [
      {
        title: "Electrical Installation",
        text: "Complete wiring and installation services for homes, offices, and commercial spaces.",
        img: "https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=1200&q=80"
      },
      {
        title: "Repair & Maintenance",
        text: "Quick repair of electrical faults, short circuits, and system issues.",
        img: "images/repair.jpg"
      },
      {
        title: "Electrical Panel Service",
        text: "Inspection and maintenance of electrical panels for safe power distribution.",
        img: "images/pannel.jpg"
      },
      {
        title: "Wiring & Rewiring",
        text: "Safe and modern wiring solutions for old and new buildings.",
        img: "images/wiring.jpg"
      }
    ]
  },

  /* 🚰 PLUMBING */
  interior: {
    title: "Plumbing Services",
    description: "Expert plumbing solutions for leak repair, pipe installation, and maintenance.",

    sections: [
      {
        title: "Leak Detection & Repair",
        text: "We quickly detect and fix water leaks to prevent damage.",
        img: "https://images.unsplash.com/photo-1607472586893-edb57bdc0e39?auto=format&fit=crop&w=1200&q=80"
      },
      {
        title: "Pipe Installation",
        text: "Durable pipe installation for kitchens, bathrooms, and buildings.",
        img: "https://images.unsplash.com/photo-1585704032915-c3400ca199e7?auto=format&fit=crop&w=1200&q=80"
      },
      {
        title: "Drain Cleaning",
        text: "Remove blockages and ensure smooth water flow in drainage systems.",
        img: "images/drainclean.jpg"
      },
      {
        title: "Bathroom & Faucet Repair",
        text: "Fix taps, showers, sinks, and bathroom fittings efficiently.",
        img: "images/bathroom.jpeg"
      }
    ]
  },

  /* ❄️ AC TECHNICIAN */
  renovation: {
    title: "AC Technician Services",
    description: "Complete AC installation, repair, and maintenance services for homes and offices.",

    sections: [
      {
        title: "AC Installation",
        text: "Professional installation of split and window AC units.",
        img: "images/acinstall.jpg"
      },
      {
        title: "AC Repair",
        text: "Fix cooling issues, gas leaks, and electrical faults quickly.",
        img: "images/acrepair.jpg"
      },
      {
        title: "AC Servicing",
        text: "Regular servicing to improve cooling performance and efficiency.",
        img: "images/acservice.avif"
      },
      {
        title: "Gas Refilling & Cleaning",
        text: "Gas refill and deep cleaning for better cooling and air quality.",
        img: "images/gas.jpg"
      }
    ]
  },

  /* 🚗 4 WHEELER PDI */
wheeler: {
  title: "4 Wheeler PDI Services",
  description: "Comprehensive Pre-Delivery Inspection (PDI) services to ensure your car is in perfect condition before delivery.",

  sections: [
    {
      title: "Exterior Inspection",
      text: "Detailed check of car body, paint quality, dents, scratches, and alignment before delivery.",
      img: "images/ext.webp"
    },
    {
      title: "Interior & Features Check",
      text: "Inspection of dashboard, seats, infotainment system, AC, and all interior functionalities.",
      img: "images/int.avif"
    },
    {
      title: "Engine & Mechanical Check",
      text: "Verification of engine condition, fluid levels, battery health, and overall mechanical performance.",
      img: "images/ingine.webp"
    },
    {
      title: "Road Test & Documentation",
      text: "Test drive evaluation along with checking documents, VIN number, and delivery readiness.",
      img: "images/road.jpg"
    }
  ]
}



};

  function loadService(type) {
    const service = data[type];
    if (!service) return;

    document.getElementById("title").innerText = service.title;
    document.getElementById("description").innerText = service.description;

    const container = document.getElementById("content");
    container.innerHTML = "";

    service.sections.forEach(section => {
      container.innerHTML += `
        <div class="section">
          <img src="${section.img}" alt="${section.title}">
          <div class="text">
            <h2>${section.title}</h2>
            <p>${section.text}</p>
          </div>
        </div>
      `;
    });

    document.querySelectorAll(".service-tabs button").forEach(btn => {
      btn.classList.remove("active");
    });

    const activeBtn = document.getElementById("btn-" + type);
    if (activeBtn) {
      activeBtn.classList.add("active");
    }
  }

  window.loadService = loadService;

  /* ✅ Load service from URL */
  const params = new URLSearchParams(window.location.search);
  const serviceType = params.get("type");

  if (serviceType && data[serviceType]) {
    loadService(serviceType);
  } else {
    loadService("interior"); // default if no type in URL
  }

  Promise.all([
    fetch("header.html").then(res => res.text()),
    fetch("footer.html").then(res => res.text()),
    fetch("contact.html").then(res => res.text())
  ])
  .then(([header, footer, contact]) => {
    document.getElementById("header").innerHTML = header;
    document.getElementById("footer").innerHTML = footer;
    document.getElementById("contact-container").innerHTML = contact;
  })
  .catch(err => console.log("Error loading components", err));

});
</script>

</body>
</html>
